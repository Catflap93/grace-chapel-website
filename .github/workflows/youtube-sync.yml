
name: Sync Grace Chapel Sermons

on:
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync-sermons:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Fetch YouTube sermons
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
          YOUTUBE_HANDLE: goodnews4folkestone
        run: |
          cd "grace-chapel-v6 2"
          python3 scripts/sync_youtube.py

      - name: Commit updated sermon library
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "grace-chapel-v6 2/data/sermons.json"

          if ! git diff --cached --quiet; then
            git commit -m "Automatically update sermon library"
            git push
          else
            echo "No sermon changes to commit"
          fi
